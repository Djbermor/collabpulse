# ==============================================================================
# CollabPulse - Staging Continuous Deployment (CD)
# ==============================================================================
name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Build, Push, Migrate & Deploy (Staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure CLI Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME_STAGING }}

      - name: Build & Push Images with Git SHA
        env:
          REGISTRY: ${{ secrets.ACR_NAME_STAGING }}.azurecr.io
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f devops/docker/Dockerfile.frontend -t $REGISTRY/collabpulse/frontend:$IMAGE_TAG -t $REGISTRY/collabpulse/frontend:staging-latest .
          docker push $REGISTRY/collabpulse/frontend:$IMAGE_TAG
          docker push $REGISTRY/collabpulse/frontend:staging-latest

      - name: Execute Controlled Database Migrations
        run: |
          echo "Executing EF Core database migrations on staging database..."
          # Run via Azure Container App job or dedicated migration runner
          az containerapp job start --name job-migrate-db-staging --resource-group rg-collabpulse-stg

      - name: Update Staging Container Apps Revisions
        run: |
          az containerapp update --name ca-frontend-stg --resource-group rg-collabpulse-stg --image ${{ secrets.ACR_NAME_STAGING }}.azurecr.io/collabpulse/frontend:${{ github.sha }}
