# ==============================================================================
# CollabPulse - Continuous Integration Pipeline (CI)
# ==============================================================================
name: CollabPulse CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend (.NET 8.0) Build, Lint, and Unit Tests
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (.NET 8.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore backend/CollabPulse.sln

      - name: Build Backend Solution
        run: dotnet build backend/CollabPulse.sln --configuration Release --no-restore

      - name: Run Backend Unit & Architecture Tests
        run: dotnet test backend/CollabPulse.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  # ----------------------------------------------------------------------------
  # Job 2: Frontend (Angular 18+) Build, Lint, and Tests
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Angular 18+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint --if-present

      - name: Typecheck / Build App
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Security & Secret Auditing
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Security Audit Script
        run: |
          chmod +x devops/security/security-scan.sh
          ./devops/security/security-scan.sh

  # ----------------------------------------------------------------------------
  # Job 4: Container Build Verification (Multi-Stage Validation)
  # ----------------------------------------------------------------------------
  container-build-check:
    name: Docker Build Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: devops/docker/Dockerfile.frontend
          push: false
          tags: collabpulse/frontend:test
