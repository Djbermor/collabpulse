# ==============================================================================
# CollabPulse - Background Asynchronous Worker Deployment
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabpulse-worker
  namespace: collabpulse-prod
  labels:
    app.kubernetes.io/name: collabpulse-worker
    app.kubernetes.io/part-of: collabpulse
    app.kubernetes.io/component: background-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: collabpulse-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collabpulse-worker
        app.kubernetes.io/part-of: collabpulse
    spec:
      containers:
        - name: worker
          image: acrcollabpulseprod.azurecr.io/collabpulse/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: collabpulse-config
            - secretRef:
                name: collabpulse-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "1024Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10000
            capabilities:
              drop:
                - ALL
