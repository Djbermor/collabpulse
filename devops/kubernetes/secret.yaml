# ==============================================================================
# CollabPulse - Secret Template & Azure Key Vault SecretProviderClass Reference
# Note: Real secrets are never stored in git. In production, this mounts secrets
# directly from Azure Key Vault using the CSI Secrets Store driver or External Secrets.
# ==============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-collabpulse
  namespace: collabpulse-prod
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${AZURE_CLIENT_ID}"
    keyvaultName: "kv-collabpulse-prod"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: DatabaseConnectionString
          objectType: secret
          objectVersion: ""
        - |
          objectName: RedisConnectionString
          objectType: secret
          objectVersion: ""
        - |
          objectName: StorageAccountConnectionString
          objectType: secret
          objectVersion: ""
        - |
          objectName: JwtSecretKey
          objectType: secret
          objectVersion: ""
        - |
          objectName: SmtpPassword
          objectType: secret
          objectVersion: ""
    tenantId: "${AZURE_TENANT_ID}"
  secretObjects:
    - secretName: collabpulse-secrets
      type: Opaque
      data:
        - objectName: DatabaseConnectionString
          key: ConnectionStrings__Database
        - objectName: RedisConnectionString
          key: ConnectionStrings__Redis
        - objectName: StorageAccountConnectionString
          key: Storage__ConnectionString
        - objectName: JwtSecretKey
          key: Jwt__Key
        - objectName: SmtpPassword
          key: Email__Password
---
# Fallback placeholder for staging/local cluster simulations
apiVersion: v1
kind: Secret
metadata:
  name: collabpulse-secrets
  namespace: collabpulse-staging
type: Opaque
stringData:
  ConnectionStrings__Database: "Host=postgres-staging;Port=5432;Database=collabpulse;Username=app;Password=REDACTED_MANAGED_VAULT;"
  ConnectionStrings__Redis: "redis-staging:6379,password=REDACTED_MANAGED_VAULT,abortConnect=false"
  Storage__ConnectionString: "DefaultEndpointsProtocol=https;AccountName=collabstaging;AccountKey=REDACTED_VAULT;EndpointSuffix=core.windows.net"
  Jwt__Key: "STAGING_SUPER_SECRET_KEY_FOR_LOCAL_SIMULATION_32_BYTES_LONG!"
  Email__Password: "STAGING_SMTP_KEY_REDACTED"
