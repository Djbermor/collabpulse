# ==============================================================================
# CollabPulse - Backend Web API Internal ClusterIP Service
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: collabpulse-api-svc
  namespace: collabpulse-prod
  labels:
    app.kubernetes.io/name: collabpulse-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: collabpulse-api
