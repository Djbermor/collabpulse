# ==============================================================================
# CollabPulse - Frontend Deployment (Angular 18+ Nginx Alpine)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabpulse-frontend
  namespace: collabpulse-prod
  labels:
    app.kubernetes.io/name: collabpulse-frontend
    app.kubernetes.io/part-of: collabpulse
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: collabpulse-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collabpulse-frontend
        app.kubernetes.io/part-of: collabpulse
    spec:
      containers:
        - name: frontend
          image: acrcollabpulseprod.azurecr.io/collabpulse/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101 # nginx user
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: collabpulse-frontend-svc
  namespace: collabpulse-prod
  labels:
    app.kubernetes.io/name: collabpulse-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: collabpulse-frontend
