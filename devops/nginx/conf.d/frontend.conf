# ==============================================================================
# CollabPulse - Angular Production Static Server (Frontend Container)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Container Health Check
    location = /health {
        access_log off;
        return 200 '{"status":"UP","component":"frontend"}\n';
        add_header Content-Type application/json;
    }

    # Cache immutable static assets (fingerprinted js/css/fonts) for 1 year
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpe?g|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Fallback: HTML index must never be cached aggressively
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
}
