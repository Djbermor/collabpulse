# ==============================================================================
# CollabPulse - High-Performance Production PostgreSQL 18.4 Configuration
# Optimized for high-concurrency SaaS multi-tenant workloads
# ==============================================================================

# Network & Connectivity
listen_addresses = '*'
max_connections = 300
superuser_reserved_connections = 5

# Memory & Caching (Optimized for 8GB RAM host / container)
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 16MB
huge_pages = try

# Write-Ahead Log (WAL) & Point-In-Time Recovery (PITR)
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Disk I/O & SSD Optimizations
random_page_cost = 1.1
effective_io_concurrency = 200
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Query Planning & Concurrency
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
default_statistics_target = 100

# Security & SSL
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = scram-sha-256

# Statements & Timeouts (Prevent hanging queries)
statement_timeout = 30000        # 30 seconds max for user queries
idle_in_transaction_session_timeout = 60000 # 60 seconds
lock_timeout = 10000             # 10 seconds

# Logging & Auditing
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250 # Log queries taking longer than 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_statement = 'ddl'
