# ==============================================================================
# CollabPulse - PostgreSQL Client Authentication Configuration (pg_hba.conf)
# Strict Least-Privilege & Network Isolation
# ==============================================================================

# TYPE  DATABASE        USER                 ADDRESS                 METHOD

# Local administrative socket access
local   all             postgres                                     peer
local   all             all                                          scram-sha-256

# IPv4 local connections for health checks
host    all             collabpulse_admin    127.0.0.1/32            scram-sha-256
host    all             collabpulse_admin    ::1/128                 scram-sha-256

# Kubernetes & Internal Pod VPC CIDR (Requires SSL/TLS and scram-sha-256)
hostssl collabpulse_prod collabpulse_app     10.100.0.0/16           scram-sha-256
hostssl collabpulse_prod collabpulse_worker  10.100.0.0/16           scram-sha-256
hostssl collabpulse_prod collabpulse_ro      10.100.0.0/16           scram-sha-256

# Reject all other unencrypted or unauthorized subnets
host    all             all                  0.0.0.0/0               reject
