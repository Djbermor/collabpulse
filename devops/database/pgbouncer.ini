# ==============================================================================
# CollabPulse - PgBouncer High-Performance Connection Pooler Configuration
# ==============================================================================

[databases]
collabpulse_prod = host=postgres port=5432 dbname=collabpulse_prod auth_user=collabpulse_admin

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Pooling Mode: transaction (best for web APIs and microservices)
pool_mode = transaction

# Connection limits
max_client_conn = 5000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 250

# Timeouts & Lifetimes
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 15
client_idle_timeout = 0
client_login_timeout = 15
query_timeout = 60
query_wait_timeout = 30

# TLS Configuration
client_tls_sslmode = prefer
server_tls_sslmode = require
