steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/collabpulse/app:$COMMIT_SHA'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/collabpulse/app:latest'
      - '.'

  # 2. Push image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/collabpulse/app:latest'

  # 3. Deploy service to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'collabpulse'
      - '--image'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/collabpulse/app:latest'
      - '--region'
      - '$_LOCATION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--min-instances'
      - '1'
      - '--cpu'
      - '1'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '3600'

substitutions:
  _LOCATION: 'us-central1'

images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/collabpulse/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
